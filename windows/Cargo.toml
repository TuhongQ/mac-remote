[package]
name = "pc-remote"
version = "0.1.0"
edition = "2021"
description = "PC 遥控：用 iPhone / iPad 遥控 Windows 电脑（Mac 遥控的 Windows 版，共用同一个网页遥控器）"

[[bin]]
name = "PCRemote"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha1_smol = "1"
base64 = "0.22"
getrandom = "0.2"
jpeg-encoder = { version = "0.7", features = ["simd"] }
openh264 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
