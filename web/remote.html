<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mac 遥控">
<meta name="theme-color" content="#0e0f11">
<title>Mac 遥控</title>
<style>
:root{
  --bg:#0e0f11; --pad:#18191d; --pad-hi:#1d1f24; --line:#26292f; --fg:#e8eaee; --dim:#8b919c; --faint:#4a4f58;
  --acc:#4c8dff; --ok:#3ccf7a; --warn:#f2b441; --bad:#ff5d5d; --btn:#212328; --btn-hi:#2a2d34; --btn-on:#2f3d57;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --r:22px; --gap:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overscroll-behavior:none}
/* 高度由脚本随 Safari 地址栏和主屏幕 App 的可用空间调整。 */
body{position:fixed;top:0;left:0;right:0;height:100vh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.ipad.land #side{width:84px}
.penhint{display:none} body.ipad .penhint{display:block}
#app{display:flex;flex-direction:column;gap:var(--gap);height:100%;padding:calc(var(--safe-t) + 4px) 14px calc(var(--safe-b) + 6px)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{display:flex;align-items:center;justify-content:space-between;height:36px;flex:none}
.conn{display:flex;align-items:center;gap:8px;min-width:0;padding:6px 12px;border-radius:999px;background:var(--pad)}
#dot{width:8px;height:8px;border-radius:50%;background:var(--bad);flex:none}
#dot.ok{background:var(--ok)} #dot.wait{background:var(--warn)}
#status{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border:0;border-radius:50%;background:var(--pad);color:var(--dim);display:flex;align-items:center;justify-content:center;padding:0}
.iconbtn.on{background:var(--btn-on);color:var(--fg)}

/* 触控板 + 左右键：做成一整块，像笔记本的触控板 */
#surface{flex:1;min-height:150px;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--line);gap:1px}
#pad{flex:1;min-height:80px;background:var(--pad);position:relative;touch-action:none;transition:background .15s}
#pad.active{background:var(--pad-hi)}
#pad.drag{box-shadow:inset 0 0 0 2px var(--acc)}
#hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#5a606a;font-size:13px;line-height:2;padding:20px;pointer-events:none;transition:opacity .4s}
#legend{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:var(--faint);font-size:11.5px;letter-spacing:.3px;pointer-events:none;opacity:0;transition:opacity .4s}
#badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--acc);background:rgba(76,141,255,.12);padding:3px 10px;border-radius:999px;opacity:0;transition:opacity .15s;pointer-events:none}
#badge.show{opacity:1}
#mouse{display:flex;gap:1px;height:56px;flex:none}
#mouse button{flex:1;border:0;background:var(--btn);color:var(--dim);font-size:14px;letter-spacing:1px;touch-action:none;transition:background .1s,color .1s}
#mouse button.on,#mouse button:active{background:var(--btn-on);color:var(--fg)}

/* 面板 */
.sheet{display:none;flex:none;background:var(--pad);border:1px solid var(--line);border-radius:18px;padding:12px}
.sheet.open{display:block}
.row{display:flex;gap:6px;margin-top:8px}
.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button.k{background:var(--btn);color:var(--fg);border:0;border-radius:11px;height:42px;font-size:14px;padding:0 4px;touch-action:manipulation}
button.k:active,button.k.on{background:var(--btn-on)}
button.k.pri{background:var(--acc);color:#fff}
.seg{display:flex;background:var(--btn);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--dim);height:32px;border-radius:8px;font-size:13.5px}
.seg button.on{background:#3a3f48;color:var(--fg)}
textarea{width:100%;margin-top:8px;height:64px;resize:none;border-radius:11px;border:1px solid var(--line);background:#111215;color:var(--fg);font-size:16px;padding:9px 11px;-webkit-user-select:text;user-select:text}
textarea:focus{outline:none;border-color:var(--acc)}
.note{color:var(--dim);font-size:12px;margin-top:8px;line-height:1.5}
#settings{max-height:52vh;overflow-y:auto}
#settings label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
#settings label:last-of-type{border:0}
#settings .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
#settings .opt .seg{flex:none;width:170px}
#sMode{font-size:12px;line-height:1.25}
#sMode.on{background:rgba(76,141,255,.45);color:#fff}
#settings .note a{color:var(--acc)}
#settings input[type=range]{flex:1;max-width:55%}
#settings input[type=text]{flex:1;max-width:60%;background:#111215;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;-webkit-user-select:text;user-select:text}

/* 底部工具栏 */
nav{display:flex;gap:var(--gap);flex:none}
nav button{flex:1;height:50px;border:0;border-radius:16px;background:var(--btn);color:var(--dim);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:7px;touch-action:manipulation;transition:background .1s,color .1s}
nav button.on{background:var(--btn-on);color:var(--fg)}
nav button:active{background:var(--btn-hi)}

#toast{position:absolute;left:50%;top:calc(var(--safe-t) + 50px);transform:translateX(-50%);background:#2b3039;color:var(--fg);padding:8px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86%;text-align:center;z-index:9}
#toast.show{opacity:1}
/* Mac 复制了东西：顶部一条小提示，点「拷到手机」才放进手机剪贴板（iOS 只允许点按时写剪贴板） */
#clipBar{position:absolute;left:50%;top:calc(var(--safe-t) + 10px);transform:translate(-50%,-140%);z-index:10;display:flex;align-items:center;gap:8px;
  max-width:min(92%,520px);padding:6px 6px 6px 12px;border-radius:14px;background:rgba(32,35,42,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 6px 24px rgba(0,0,0,.45);font-size:13px;color:var(--fg);transition:transform .25s}
#clipBar.show{transform:translate(-50%,0)}
#clipBar .txt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;color:#c9ccd3}
#clipBar img{height:32px;max-width:64px;border-radius:5px;object-fit:cover}
#clipBar button{flex:none;border:0;border-radius:10px;padding:7px 11px;background:var(--acc);color:#fff;font-size:13px}
#clipBar button.x{background:transparent;color:var(--dim);padding:7px 6px}
#clipImg{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#ddd;font-size:13px;padding:20px}
#clipImg.show{display:flex}
#clipImg img{max-width:100%;max-height:75%;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#toast.bad{background:#5a2626}
/* 屏幕镜像 */
.hbtns{display:flex;gap:8px}
canvas.view{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:none}
body.screen-on canvas.view.on{display:block}
canvas.view{transform-origin:0 0}
/* 手机自己画的 Mac 光标（参考 Glass）：手指一动就跟上 */
#cur{position:absolute;left:0;top:0;pointer-events:none;z-index:3;display:none;will-change:transform}
#cur img{display:block;width:100%;height:100%;image-rendering:auto}
body.screen-on #cur.on{display:block}
body.screen-on #hint,body.screen-on #legend{display:none}
body.screen-on #pad{background:#000}
#fps{position:absolute;top:8px;left:10px;font-size:10.5px;color:rgba(255,255,255,.45);pointer-events:none;display:none;white-space:pre-line}
body.screen-on #fps{display:block}
#scrClose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(30,32,38,.75);color:#ddd;display:none;align-items:center;justify-content:center;padding:0}
/* 看屏幕时的横屏布局：左边大画面，右边一列按钮 */
#side{display:none}
body.land #app{flex-direction:row;gap:8px;padding:8px calc(env(safe-area-inset-right,0px) + 8px) 8px calc(env(safe-area-inset-left,0px) + 8px)}
body.land header,body.land nav,body.land #mouse{display:none}
body.land #surface{min-height:0;border-radius:16px}
body.land #side{display:flex;flex-direction:column;gap:8px;width:68px;flex:none}
.sbtn{flex:1;min-height:0;border:0;border-radius:14px;background:var(--btn);color:var(--dim);font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none}
.sbtn.big{flex:1.5}
.sbtn.on,.sbtn:active{background:var(--btn-on);color:var(--fg)}
/* 横屏时快捷 / 设置面板浮在画面上 */
body.land .sheet.open:not(#sheetKb){position:absolute;top:8px;bottom:8px;right:84px;width:min(440px,62%);overflow-y:auto;z-index:5;max-height:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
/* 手机竖着拿时，把整个界面转 90°（手机向左横过来看） */
body.rot #app{position:absolute;top:0;left:0;width:var(--H);height:var(--W);transform-origin:0 0;transform:translateX(var(--W)) rotate(90deg);
  padding:8px calc(var(--safe-b) + 8px) 8px calc(var(--safe-t) + 8px)}
#app{position:relative}
/* 全屏看屏幕（iPad 默认）：画面铺满整屏，按钮收进右下角的半透明小圆点，点一下弹出半透明按钮栏，几秒不碰自动收起 */
#fab{display:none}
body.imm #app{padding:env(safe-area-inset-top,0px) 0 0 0;gap:0;flex-direction:row}
body.imm header,body.imm nav,body.imm #mouse{display:none}
body.imm #surface{border:0;border-radius:0;min-height:0}
body.imm #side{display:flex;flex-direction:column;gap:8px;position:absolute;z-index:6;right:calc(env(safe-area-inset-right,0px) + 14px);top:calc(50% + env(safe-area-inset-top,0px) / 2);
  width:76px;height:min(620px,calc(100% - 130px));padding:8px;border-radius:22px;background:rgba(20,21,25,.5);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transform:translateY(-50%);transition:opacity .2s,transform .2s}
body.imm:not(.sideOpen) #side{opacity:0;pointer-events:none;transform:translate(24px,-50%)}
body.imm .sbtn{background:rgba(255,255,255,.08);color:#e6e8ec}
body.imm .sbtn.on,body.imm .sbtn:active{background:rgba(76,141,255,.45);color:#fff}
body.imm #fab{display:flex;position:absolute;z-index:7;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(var(--safe-b) + 16px);
  width:48px;height:48px;border-radius:50%;border:0;padding:0;align-items:center;justify-content:center;color:#fff;
  background:rgba(20,21,25,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:.55;touch-action:none;transition:opacity .2s}
body.imm.sideOpen #fab{opacity:.95}
body.imm .sheet.open:not(#sheetKb){position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);bottom:12px;right:104px;width:min(440px,62%);overflow-y:auto;z-index:8;max-height:none;
  background:rgba(24,25,29,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.5)}
body.imm #fps{top:10px;left:12px}
#ipadStreamStatus{display:none}
body.ipad.screen-on #fps{display:none}
body.ipad.screen-on #ipadStreamStatus{display:block;position:absolute;z-index:4;
  top:6px;left:25%;transform:translateX(-50%);width:max-content;pointer-events:none;
  color:#fff;background:transparent;text-shadow:0 1px 2px rgba(0,0,0,.8);
  font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 全屏时按钮一直显示（iPhone 默认）：右边一条窄栏，在画面旁边不挡画面，不自动收起 */
body.imm.pin #side,body.imm.pin:not(.sideOpen) #side{position:static;transform:none;opacity:1;pointer-events:auto;flex:none;
  width:auto;height:auto;gap:5px;margin:0;padding:6px max(5px,calc(env(safe-area-inset-right,0px) - 40px)) 6px 5px;
  border-radius:0;background:#0d0e11;-webkit-backdrop-filter:none;backdrop-filter:none;border-left:1px solid rgba(255,255,255,.06)}
body.rot.imm.pin #side{padding-right:max(5px,calc(var(--safe-b) - 20px))}   /* 竖着拿时右边是手机底部（横条） */
body.imm.pin #fab{display:none}
body.imm.pin .sbtn{flex:1;width:36px;max-height:46px;border-radius:10px;font-size:11px;letter-spacing:-.3px;background:rgba(255,255,255,.07);color:#c9ccd3}
body.imm.pin .sbtn.big{flex:1.3;max-height:60px}
body.imm.pin #side{justify-content:center}
body.imm.pin .sbtn svg.i{width:18px;height:18px;stroke-width:1.7}
body.imm.pin .sbtn.on,body.imm.pin .sbtn:active{background:rgba(76,141,255,.5);color:#fff}
body.imm.pin #sExit{color:#ff8a8a}
body.imm.pin #sMode{font-size:10px;letter-spacing:-.5px}
body.imm.pin .sheet.open:not(#sheetKb){right:56px}
/* 浮动键盘使用遥控画面的坐标，和画面一起旋转。 */
#sheetKb.open{position:absolute;z-index:11;display:flex;flex-direction:column;gap:4px;
  width:min(365px,calc(100% - var(--kb-left) - var(--kb-right)));overflow:hidden;
  max-height:calc(100% - var(--kb-top) - var(--kb-bottom));padding:4px 6px;border-radius:14px;
  background:rgba(24,25,29,.97);box-shadow:0 8px 26px rgba(0,0,0,.45)}
.kb-head,.kb-edit,.kb-keys>div{display:flex;align-items:center;gap:4px}
.kb-head{flex:none}
#kbDrag{flex:1;min-width:0;padding:0 6px;line-height:28px;color:var(--dim);font-size:13px;touch-action:none;cursor:grab}
#kbDrag:active{cursor:grabbing}
#kbBody{min-height:0;overflow:auto;overscroll-behavior:contain}
#sheetKb .k{height:28px;padding:0 7px;font-size:12px;white-space:nowrap}
#sheetKb select{width:auto;height:28px;padding:0 3px;font-size:12px;color:var(--fg);background:var(--pad);border:1px solid var(--line);border-radius:8px}
.kb-edit{margin-bottom:4px}
#sheetKb textarea{flex:1;min-width:0;margin:0;height:33px;padding:5px 8px}
#sheetKb.native .kb-edit{flex-wrap:wrap}
#sheetKb.native textarea{flex-basis:100%;height:clamp(48px,23vh,100px);height:clamp(48px,calc(var(--H) * .27),100px);line-height:1.4}
#sheetKb.native #btnSend{margin-left:auto}
#sheetKb:is(.native,.system-docked) #kbDrag{cursor:default;touch-action:auto}
#sheetKb [hidden]{display:none}
.kb-keys{display:grid;gap:2px}
.kb-keys>div:nth-child(2){padding-inline:4%}
#sheetKb .kb-keys .k{flex:1;min-width:0;padding:0;height:28px;font-size:15px;touch-action:manipulation}
#sheetKb .kb-keys .wide{flex:1.65;font-size:12px}
#sheetKb .kb-keys .space{flex:5;font-size:12px}
#kbMore{margin-top:4px}
#btnKbMore{font-size:16px}
#kbMore .grid{grid-template-columns:repeat(5,1fr)}
body.ipad #sheetKb.open{width:min(clamp(440px,64%,660px),calc(100% - var(--kb-left) - var(--kb-right)));
  padding:clamp(6px,1vmin,12px);gap:6px}
body.ipad .kb-head,body.ipad .kb-edit,body.ipad .kb-keys>div{gap:6px}
body.ipad .kb-keys{gap:4px}
body.ipad #sheetKb .k,body.ipad #sheetKb select{height:clamp(32px,4.4vmin,42px);font-size:14px}
body.ipad #sheetKb .kb-keys .k{height:clamp(34px,5vmin,48px);font-size:19px}
body.ipad #sheetKb .kb-keys .wide,body.ipad #sheetKb .kb-keys .space{font-size:15px}
body.ipad #sheetKb textarea{height:clamp(36px,5vmin,48px);padding:7px 10px}
body.ipad #sheetKb.native textarea{height:clamp(60px,calc(var(--H) * .28),140px)}
body #sheetKb.open.system-docked{width:calc(100% - var(--kb-left) - var(--kb-right));
  padding-inline:max(8px,var(--kb-safe-x));border-radius:16px 16px 0 0;background:var(--pad);
  box-shadow:0 -4px 18px rgba(0,0,0,.28)}
#sheetKb.system-docked .kb-head,#sheetKb.system-docked #kbBody{width:100%;max-width:660px;align-self:center}
body #sheetKb.open.system-docked textarea{height:clamp(44px,calc((var(--H) - var(--kb-top) - var(--kb-bottom)) * .2),96px)}
#sheetKb.system-docked .kb-keys,#sheetKb.system-docked #kbMore,#sheetKb.system-docked #btnKbMore{display:none}

/* Pencil 手写板：用 iPad 自带的随手写（Scribble）把字写进来，实时打到 Mac 上 */
#hw{display:none;position:absolute;inset:calc(env(safe-area-inset-top,0px) + 10px) 14px 14px;z-index:9;flex-direction:column;border-radius:22px;overflow:hidden;
  background:rgba(10,11,13,.5);box-shadow:0 0 0 2px rgba(76,141,255,.75),0 10px 40px rgba(0,0,0,.45)}
#hw.open{display:flex}
.hwbar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(20,21,25,.82);flex:none}
.hwbar .t{flex:1;min-width:0;color:#cfd3da;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwbar button{height:40px;min-width:58px;border:0;border-radius:12px;background:rgba(255,255,255,.13);color:#fff;font-size:15px;padding:0 14px;touch-action:manipulation}
.hwbar button:active{background:rgba(255,255,255,.25)}
.hwbar button.pri{background:var(--acc)}
#hwText{flex:1;width:100%;border:0;outline:none;resize:none;background:transparent;color:#fff;font-size:42px;line-height:1.35;
  padding:18px 24px;-webkit-user-select:text;user-select:text;caret-color:var(--acc);text-shadow:0 1px 6px rgba(0,0,0,.6)}
#hwText::placeholder{color:rgba(255,255,255,.45);font-size:24px}
#sHw{display:none} body.ipad #sHw{display:flex}
#hap{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M6.5 9.5h.01M10 9.5h.01M13.5 9.5h.01M17 9.5h.01M6.5 13h.01M17 13h.01M10 13h3.5M8 15.5h8"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-cmd" viewBox="0 0 24 24"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></symbol>
</svg>
<div id="app">
  <header>
    <div class="conn"><span id="dot"></span><span id="status">连接中…</span></div>
    <div class="hbtns">
      <button id="btnScreen" class="iconbtn" aria-label="显示 Mac 屏幕"><svg class="i"><use href="#i-screen"/></svg></button>
      <button id="btnSettings" class="iconbtn" aria-label="设置"><svg class="i"><use href="#i-sliders"/></svg></button>
    </div>

<label id="hap"><input type="checkbox" switch></label>
<div id="safeProbe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------- 设置 ----------
const DEF = {speed: 2.2, scroll: 1.6, natural: true, inertia: true, paste: false, haptic: true, fps: 30, autoLand: true, video: true};
let S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('wb.settings') || '{}')); } catch (e) {}
if (S.fpsV !== 2) { S.fps = 30; S.fpsV = 2; }   // 帧率上限提到 60 后，旧的默认值 12 换成 30
if (S.vMaxV !== 2) { delete S.vMaxW; S.vMaxV = 2; }   // 视频最高分辨率提到 2880 后，之前降下来的档位重新试一次
const saveS = () => { try { localStorage.setItem('wb.settings', JSON.stringify(S)); } catch (e) {} };

const pageParams = new URLSearchParams(location.search);
const requestedFps = Number(pageParams.get('fps'));
if (location.protocol === 'https:' && requestedFps >= 10 && requestedFps <= 120 && requestedFps % 5 === 0) {
  S.fps = requestedFps;
  S.video = true;
  saveS();
  pageParams.delete('fps');
  history.replaceState(history.state, '', location.pathname + '?' + pageParams + location.hash);
}
let TOKEN = pageParams.get('token') || '';
try {
  if (TOKEN) localStorage.setItem('wb.token', TOKEN);
  else TOKEN = localStorage.getItem('wb.token') || '';
} catch (e) {}

// ---------- 设备 ----------
const IPHONE = /iPhone/.test(navigator.userAgent);
const IPAD = /iPad/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1 && !/iPhone|Android/.test(navigator.userAgent));
function isLandscape() {
  // iPhone 的系统方向不受软键盘挤压可见区域的影响。
  if (IPHONE && typeof window.orientation === 'number') return Math.abs(window.orientation) === 90;
  return document.body.clientWidth > window.innerHeight;
}
if (IPAD) document.body.classList.add('ipad');
if (S.immersive === undefined) S.immersive = true;   // 默认全屏看屏幕
if (S.fitMac === undefined) S.fitMac = true;         // 默认让 Mac 适配本机的屏幕比例
// iPhone 也默认全屏 + 让 Mac 适配手机比例（横过来看，Mac 变成和 iPhone 一样的宽屏）。以前存过的旧默认值改一次
if (!S.fitPhone) { S.fitPhone = 1; if (!IPAD) { S.immersive = true; S.fitMac = true; } saveS(); }
if (S.autoUnlock === undefined) S.autoUnlock = true;   // 只有在 Mac 上设了密码才会生效
if (S.clipSync === undefined) S.clipSync = true;
if (S.localCursor === undefined) S.localCursor = true;
if (S.pinSide === undefined) S.pinSide = !IPAD;       // iPhone 默认按钮栏一直显示
if (S.scribble === undefined) S.scribble = true;
if (S.touchMode === undefined) S.touchMode = IPAD ? 'touch' : 'pad';   // 看屏幕时：触摸屏（点哪操作哪）/ 触控板
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.body.classList.add('standalone');

// ---------- 提示 / 震动 ----------
let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 1800);
}
// iOS 18+ Safari：点一下 switch 开关的 label 会产生轻微触感，网页没有别的震动接口
function haptic() { if (S.haptic) try { $('#hap').click(); } catch (e) {} }

// ---------- 连的是 Mac 还是 Windows：按钮上的说法跟着换（发出的按键名不变，Windows 端自己翻译）----------
let hostOS = 'mac', hostKeyboardFocus = false;
function applyOS(m) {
  hostOS = m.os || 'mac';
  hostKeyboardFocus = hostOS === 'mac' || m.keyboardFocus === true;
  if (hostOS !== 'windows') return;
  document.title = 'PC 遥控';
  document.querySelectorAll('.mac-only').forEach(e => e.style.display = 'none');   // Windows 不能遥控解锁
  const rename = {'调度中心': '任务视图', '应用窗口': '任务视图', '退出 App': '关闭程序', '聚焦': '搜索', '显示桌面': '显示桌面'};
  document.querySelectorAll('button.k').forEach(b => {
    const t = b.textContent.trim();
    if (rename[t]) b.textContent = rename[t];
    else if (t.startsWith('⌘')) b.textContent = 'Ctrl+' + t.slice(1);
    if (/^亮度/.test(t)) b.style.visibility = 'hidden';           // Windows 版不支持调亮度
  });
  if (m.screen === false) $('#btnScreen').style.display = 'none';  // 还不能看屏幕的版本
  showVideoNote();
  const hint = $('#hint'); if (hint) hint.innerHTML = hint.innerHTML.replace('调度中心', '任务视图');
}

// ---------- 连接 ----------
let pageVer = null, hostTextReceipt = false;
let kbIsUp = false;   // 系统键盘占用了网页可见区域
let ws = null, retry = 0, fatal = false, pingId = 0, pingSent = {}, latency = null;
function setStatus(state, text) { $('#dot').className = state; $('#status').textContent = text; }
function connect() {
  if (fatal || (ws && ws.readyState < 2)) return;
  if (!TOKEN) { setStatus('', '缺少 token，请在设置里填写'); openSheet('settings'); return; }
  setStatus('wait', '连接中…');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  hostTextReceipt = false;
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { lastRx = performance.now(); retry = 0; setStatus('ok', '已连接 ' + location.hostname); ping(); if (screenOn) subscribeScreen(); };
  ws.onmessage = ev => {
    lastRx = performance.now();
    if (typeof ev.data !== 'string') { onScreenData(ev.data); return; }   // 二进制 = 屏幕画面
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.t === 'screen') {
      if (!m.ok) { toast(m.text, true); setScreen(false); }
      else { codec = m.codec || 'jpeg'; hostStatsOK = m.stats === true; }
      return;
    }
    if (m.t === 'hello') { hostTextReceipt = m.textReceipt === true; applyOS(m); if (m.locked) onLocked(m.unlock); }
    if (m.t === 'hello' && m.page) {
      if (pageVer && pageVer !== m.page) { location.reload(); return; }
      pageVer = m.page;
    }
    if (m.t === 'hello') { if (m.https && location.protocol === 'http:') probeHttps(m.https); else reportClient(); return; }
    if (m.t === 'pong') {
      const t0 = pingSent[m.id]; delete pingSent[m.id];
      if (t0) { latency = Math.round(performance.now() - t0); setStatus('ok', `已连接 ${location.hostname} · ${latency}ms`); }
    } else if (m.t === 'cur') {
      onCursor(m);
    } else if (m.t === 'curImg') {
      onCursorImg(m);
    } else if (m.t === 'screenInfo') {
      scrInfo = {w: m.w || 0, h: m.h || 0, hz: m.hz || 0};
    } else if (m.t === 'screenStats') {
      readHostStats(m);
    } else if (m.t === 'fit') {
      if (!m.ok) toast('Mac 没能改成这块屏幕的比例，先按原比例显示', true);
    } else if (m.t === 'textFocus') {
      if (m.id === penTapId && m.editable && S.scribble) hwOpen();
    } else if (m.t === 'keyboardFocus') {
      onKeyboardFocus(m);
    } else if (m.t === 'clip') {
      if (S.clipSync) showClip(m);
    } else if (m.t === 'locked') {
      onLocked(m.unlock);
    } else if (m.t === 'textReceipt') {
      finishKbText(m.id, m.ok ? '' : (m.text || '电脑没能发送文字'));
    } else if (m.t === 'reply') {
      toast(m.text, !m.ok);
    } else if (m.t === 'error') {
      fatal = true; setStatus('', m.text); toast(m.text, true); openSheet('settings');
    }
  };
  ws.onclose = lost;
}
function lost() {
  ws = null;
  keyboardFocusRequest = null;
  if (kbPending) finishKbText(kbPending.id, '连接中断，文字已保留');
  if (fatal) return;
  if (document.visibilityState !== 'visible') { setStatus('', '已断开'); return; }   // 在后台不重连，回到前台再连
  setStatus('', '已断开，重连中…');
  setTimeout(connect, Math.min(3000, 300 * 2 ** retry++));
}
function send(o) {
  if (!ws || ws.readyState !== 1) return false;
  try { ws.send(JSON.stringify(o)); } catch (e) { return false; }
  // 点哪点哪 / 拖动 / 笔：光标马上画到那里，不等 Mac 报回来
  if (CUR.on && (o.t === 'moveTo' || o.t === 'clickAt' || o.t === 'pen') && o.x != null) { CUR.x = o.x; CUR.y = o.y; CUR.hold = performance.now() + 250; pendMoves.length = 0; drawCursor(); }
  return true;
}
function ping() { const id = ++pingId; pingSent[id] = performance.now(); send({t: 'ping', id}); }
setInterval(() => { if (document.visibilityState === 'visible') ping(); }, 3000);
// 连接「假活着」：手机睡眠回来、换了 Wi-Fi 后，WebSocket 可能看起来还开着，其实已经不通了（触控板没反应但显示已连接）。
// 每 3 秒 ping 一次，7 秒什么都没收到就当断了，马上重连
let lastRx = 0;
function dropDead(why) {
  if (!ws) return;
  const dead = ws;
  dead.onclose = dead.onmessage = dead.onerror = null;
  try { dead.close(); } catch (e) {}
  console.log('连接没回应，重连：' + why);
  lost();
}
setInterval(() => {
  if (document.visibilityState === 'visible' && ws && ws.readyState === 1 && performance.now() - lastRx > 7000) dropDead('7 秒没收到数据');
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (ws && ws.readyState === 1) {   // 回到前台：先确认旧连接还通，2 秒没回应就重连
      const t = performance.now(); ping();
      setTimeout(() => { if (ws && ws.readyState === 1 && lastRx < t) dropDead('回到前台后没回应'); }, 2000);
    }
    connect(); if (screenOn) { subscribeScreen(); holdAwake(true); }
  }
  else { releaseAll(); if (screenOn) send({t: 'screen', on: false}); }
});

// ---------- 触控板 ----------
const pad = $('#pad'), badge = $('#badge');
// 轻点允许的抖动：按每根手指离自己起点最远的距离算（不是走过的总路程——iPad 触屏采样快，微小抖动会越积越多）
const TAP_SLOP = IPAD ? 14 : 10, TAP_MS = 320, MULTI_TAP_MS = 450, HOLD_MS = 450;
let g = null;                     // 当前手势
const pend = {mx: 0, my: 0, sx: 0, sy: 0};
let rafOn = false;

// 第一次用时显示完整手势说明，摸过一次之后换成底部一行小字
function hideHint() { $('#hint').style.opacity = '0'; $('#legend').style.opacity = '1'; }
function showBadge(txt) { badge.textContent = txt; badge.className = txt ? 'show' : ''; }

function schedule() { if (!rafOn) { rafOn = true; requestAnimationFrame(flush); } }
function flush() {
  rafOn = false;
  if (pend.mx || pend.my) {
    const dx = +pend.mx.toFixed(2), dy = +pend.my.toFixed(2), sq = ++moveSeq;
    send({t: 'move', dx, dy, s: sq}); pend.mx = pend.my = 0;
    if (CUR.on) { pendMoves.push({s: sq, dx, dy}); drawCursor(true); }
  }
  if (pend.sx || pend.sy) { send({t: 'scroll', dx: +pend.sx.toFixed(2), dy: +pend.sy.toFixed(2), p: 2, m: 0}); pend.sx = pend.sy = 0; }
}

// 指针加速：慢速精确、快速移动距离大
function queueMove(dx, dy, dt) {
  const v = Math.hypot(dx, dy) / dt;            // CSS px / ms
  const gain = S.speed * clamp(0.45 + v * 1.1, 0.45, 4);
  pend.mx += dx * gain; pend.my += dy * gain; flush();
}

// 滚动：k 是倍率（触控板 = 设置里的滚动速度；触摸屏 = 画面和 Mac 的比例，内容正好跟着手指走）
function queueScroll(dx, dy, now, k) {
  const sx = dx * k, sy = dy * k;
  if (!g.scrollBegan) { g.scrollBegan = true; send({t: 'scroll', dx: 0, dy: 0, p: 1, m: 0}); }
  pend.sx += sx; pend.sy += sy; schedule();
  g.vel.push({t: now, x: sx, y: sy});
  while (g.vel.length && now - g.vel[0].t > 90) g.vel.shift();
}
// 结束滚动，按松手前的速度惯性滚
function endScroll() {
  flush();
  send({t: 'scroll', dx: 0, dy: 0, p: 4, m: 0});
  g.scrollBegan = false;
  const v = g.vel, now = performance.now();
  if (v.length >= 2 && now - v[v.length - 1].t < 60) {
    const span = Math.max(16, v[v.length - 1].t - v[0].t);
    let x = 0, y = 0; for (const s of v) { x += s.x; y += s.y; }
    startMomentum(x / span, y / span);
  }
}

// 惯性滚动：手指离开后按速度衰减继续发 momentum 事件
let mom = null;
function startMomentum(vx, vy) {
  if (!S.inertia || Math.hypot(vx, vy) < 0.25) return;
  mom = {vx, vy, t: performance.now(), started: false};
  const step = now => {
    if (!mom) return;
    const dt = Math.min(48, now - mom.t); mom.t = now;
    const decay = Math.pow(0.95, dt / 16.7);
    mom.vx *= decay; mom.vy *= decay;
    if (Math.hypot(mom.vx, mom.vy) < 0.03) { stopMomentum(); return; }
    send({t: 'scroll', dx: +(mom.vx * dt).toFixed(2), dy: +(mom.vy * dt).toFixed(2), p: 0, m: mom.started ? 2 : 1});
    mom.started = true;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function stopMomentum() {
  if (!mom) return;
  if (mom.started) send({t: 'scroll', dx: 0, dy: 0, p: 0, m: 3});
  mom = null;
}

const RANK = {move: 1, scroll: 2, drag: 3, swipe: 4};
function modeFor(n) { return n >= 4 ? 'swipe' : n === 3 ? 'drag' : n === 2 ? 'scroll' : 'move'; }
function setMode(m) {
  if (g.scrollBegan) { flush(); send({t: 'scroll', dx: 0, dy: 0, p: 4, m: 0}); g.scrollBegan = false; }
  g.mode = m; g.modeTravel = 0; g.sub = null;
  showBadge({drag: '拖动中', swipe: '四指'}[m] || '');
}
function centroid(list) { let x = 0, y = 0; for (const t of list) { x += t.clientX; y += t.clientY; } return {x: x / list.length, y: y / list.length}; }
// 手势中途被打断（落笔、切到后台）：别让 Mac 上的鼠标键 / 滚动停在半路
function abortGesture() {
  if (!g) return;
  clearHold();
  if (g.down || g.absDown) send({t: 'up', b: 'left'});
  if (g.scrollBegan) { flush(); send({t: 'scroll', dx: 0, dy: 0, p: 4, m: 0}); }
  g = null;
  showBadge(''); pad.classList.remove('active', 'drag');
}

// ---------- Apple Pencil：笔尖直接点、拖、写字；手指照旧当触控板 ----------
let pen = null;
const stylusIn = list => { for (const t of list) if (t.touchType === 'stylus') return t; return null; };
function penStart(t) {
  keyboardFocusRequest = null;
  abortGesture();
  stopMomentum();
  const p = penPoint(t, false);
  pen = {id: t.identifier, live: !!p, t0: performance.now(), x0: t.clientX, y0: t.clientY, far: false};
  if (p) { send({t: 'pen', p: 0, x: p.x, y: p.y}); pad.classList.add('active'); }
  hideHint();
}
function penMove(t) {
  if (!pen.live) return;
  if (Math.hypot(t.clientX - pen.x0, t.clientY - pen.y0) > 10) pen.far = true;
  const p = penPoint(t, true); send({t: 'pen', p: 1, x: p.x, y: p.y});
}
let penTapId = 0;
function penEnd(t, cancelled) {
  if (pen.live) {
    const p = penPoint(t, true), msg = {t: 'pen', p: 2, x: p.x, y: p.y};
    // 轻点（没怎么动、很快抬笔）：电脑点完会看看点到的是不是输入框
    const tap = !cancelled && !pen.far && performance.now() - pen.t0 < 400;
    if (tap && S.scribble) { msg.tap = true; msg.id = ++penTapId; }
    if (tap && !S.scribble) sendTextTarget(msg); else send(msg);
  }
  pen = null; pad.classList.remove('active');
}
const penTouch = e => pen && [...e.changedTouches].find(t => t.identifier === pen.id);

// ---------- 触摸屏模式：看屏幕时手指直接操作画面上的东西（像用 iPad 一样）----------
// 点一下 = 点那里；连点 = 双击；滑动 = 滚动（内容跟着手指走）；长按 = 右键，长按后拖 = 按住拖；
// 双指：滑动滚动、轻点右键、捏合缩放；三指：拖动 / 轻点中键；四指：切换桌面、调度中心
const touchMode = () => screenOn && S.touchMode === 'touch' && view.width > 0;
let scrInfo = {w: 0, h: 0, hz: 0};      // Mac 屏幕的点数（Mac 开始截屏时发来）
// 手指在画面上走 1 个 CSS 像素，相当于 Mac 上走几个点
function macPerPx() {
  if (!view.width) return 1;
  const k = Math.min(pad.clientWidth / view.width, pad.clientHeight / view.height);
  return (scrInfo.w || view.width / 2) / (view.width * k * Z.s);
}
// 连点两下：第二下用第一下的位置，Mac 才认成双击（手指每次落点会差一点）
let lastTap = null;
function tapPoint(cx, cy) {
  const p = screenPoint(cx, cy, false);
  if (!p) return null;
  const now = performance.now();
  // 范围要小：连着点相邻的两个小图标（比如程序坞）时不能被当成双击
  if (lastTap && now - lastTap.t < 400 && Math.hypot(cx - lastTap.cx, cy - lastTap.cy) < 16) { lastTap.t = now; return lastTap.p; }
  lastTap = {t: now, cx, cy, p};

}
function armHold() {
  clearHold();

    if (!g || g.mode || g.n !== 1 || g.disp >= TAP_SLOP) return;
    const f = [...g.f.values()][0];
    const p = f && screenPoint(f.x0, f.y0, false);
    if (!p) return;
    g.held = true; g.anchor = p;
    haptic(); showBadge('松手 = 右键 · 拖动 = 按住拖');

}
function clearHold() { if (g && g.holdT) { clearTimeout(g.holdT); g.holdT = null; } }

function newGesture(now) {
  return {start: now, last: now, max: 0, n: 0, f: new Map(), disp: 0, mode: null, sub: null, modeTravel: 0,

          touch: touchMode(), holdT: null, held: false, anchor: null, aimed: false};
}
// 多指阶段从这里开始算（分辨滚动 / 捏合、多指轻点的位置都用它）
function beginMulti(list) {
  const m = {p: new Map(), d0: 0, dPrev: 0};
  for (const t of list) m.p.set(t.identifier, {x: t.clientX, y: t.clientY});
  if (list.length >= 2) m.d0 = m.dPrev = Math.hypot(list[0].clientX - list[1].clientX, list[0].clientY - list[1].clientY);
  const c = centroid(list); m.cx = c.x; m.cy = c.y;
  g.multi = m;
  if (!(g.touch && g.sub === 'pan' && g.scrollBegan)) g.sub = null;
}

pad.addEventListener('touchstart', e => {
  e.preventDefault();
  const st = stylusIn(e.changedTouches);
  if (st && !pen) { penStart(st); return; }
  if (pen) return;                  // 用笔时手掌碰到屏幕不算
  stopMomentum();
  const now = performance.now();
  if (!g) { keyboardFocusRequest = null; g = newGesture(now); }
  for (const t of e.changedTouches) {
    if (t.touchType === 'stylus') continue;
    g.f.set(t.identifier, {x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY});
    if (g.x0 == null) { g.x0 = t.clientX; g.y0 = t.clientY; }
  }
  const list = [...e.targetTouches].filter(t => g.f.has(t.identifier));
  g.n = list.length;
  g.max = Math.max(g.max, g.n);
  if (g.n >= 2) { clearHold(); beginMulti(list); }
  else if (g.touch && !g.mode && !g.held) armHold();
  pad.classList.add('active');
}, {passive: false});

pad.addEventListener('touchmove', e => {
  e.preventDefault();
  if (pen) { const t = penTouch(e); if (t) penMove(t); return; }
  if (!g) return;
  const now = performance.now();
  const cur = [...e.targetTouches].filter(t => g.f.has(t.identifier));
  if (!cur.length) return;
  let dx = 0, dy = 0;
  for (const t of cur) {
    const p = g.f.get(t.identifier);
    dx += t.clientX - p.x; dy += t.clientY - p.y;
    p.x = t.clientX; p.y = t.clientY;
    g.disp = Math.max(g.disp, Math.hypot(p.x - p.x0, p.y - p.y0));
  }
  dx /= cur.length; dy /= cur.length;
  if (rotated) [dx, dy] = [dy, -dx];   // 界面转了 90°：手指方向换算回界面里的方向
  const dt = Math.max(4, now - g.last); g.last = now;
  if (g.touch) touchMove(cur, dx, dy, dt, now); else padMove(cur, dx, dy, dt, now);
}, {passive: false});

// 触控板模式
function padMove(cur, dx, dy, dt, now) {
  const want = modeFor(cur.length);
  if (!g.mode) { if (g.disp < 3) return; setMode(want); }
  else if (RANK[want] > RANK[g.mode] && g.modeTravel < 30) setMode(want); // 手指没同时落下时升级手势
  g.modeTravel += Math.hypot(dx, dy);
  switch (g.mode) {
    case 'move':
      if (cur.length === 1) queueMove(dx, dy, dt);
      break;
    case 'scroll':
      twoFinger(cur, dx, dy, now, S.scroll * (S.natural ? 1 : -1));
      break;
    case 'drag':
      if (!g.down) { g.down = true; send({t: 'down', b: 'left'}); pad.classList.add('drag'); haptic(); }
      queueMove(dx, dy, dt);
      break;
    case 'swipe':
      g.sx += dx; g.sy += dy;
      break;
  }
}

// 两指：看两根手指往哪走——同方向是滚动，反方向（指间距明显在变）是捏合。
// 判断要等手指走出轻点的范围，判断前走过的那段也补上，所以开头不会「没反应」
function twoFinger(cur, dx, dy, now, k) {
  const m = g.multi;
  if (cur.length !== 2 || !m) return;
  const [a, b] = cur, pa = m.p.get(a.identifier), pb = m.p.get(b.identifier);
  if (!pa || !pb) return;
  const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (!g.sub) {
    const ax = a.clientX - pa.x, ay = a.clientY - pa.y, bx = b.clientX - pb.x, by = b.clientY - pb.y;
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
    if (Math.max(la, lb) < TAP_SLOP) return;            // 还在轻点的范围里
    const dd = dist - m.d0, pan = Math.hypot((ax + bx) / 2, (ay + by) / 2);
    const cos = la > 3 && lb > 3 ? (ax * bx + ay * by) / (la * lb) : 0;
    const pinch = (cos < -0.3 && Math.abs(dd) > 10) || (cos < 0.5 && Math.abs(dd) > 2 * pan && Math.abs(dd) > 18);
    g.sub = pinch ? 'pinch' : 'pan';
    m.dPrev = dist;
    if (pinch && screenOn && view.width) { zoomBegin(m); zoomPinch(cur); return; }   // 看屏幕时：在手机上放大画面
    if (pinch) { showBadge('缩放'); g.zoom = dd; }
    else if (g.touch && Z.s > 1.02) { g.sub = 'view'; }                              // 放大着：双指拖 = 移动视野
    else { let cx = (ax + bx) / 2, cy = (ay + by) / 2; if (rotated) [cx, cy] = [cy, -cx]; queueScroll(cx, cy, now, k); }
    return;
  }
  if (g.sub === 'pan') queueScroll(dx, dy, now, k);
  else if (g.sub === 'view') panView(dx, dy);
  else if (g.zs) zoomPinch(cur);
  else {
    g.zoom += dist - m.dPrev; m.dPrev = dist;
    while (g.zoom > 45) { send({t: 'key', key: 'cmd+='}); g.zoom -= 45; haptic(); }
    while (g.zoom < -45) { send({t: 'key', key: 'cmd+-'}); g.zoom += 45; haptic(); }
  }
}

// 触摸屏模式
function touchMove(cur, dx, dy, dt, now) {
  if (g.held) {                       // 长按之后拖动 = 在按住的位置按下鼠标，跟着手指拖
    const t = cur[0], p = screenPoint(t.clientX, t.clientY, true);
    if (!p) return;
    if (!g.absDown) {
      if (g.disp < TAP_SLOP) return;
      g.absDown = true; send({t: 'pen', p: 0, x: g.anchor.x, y: g.anchor.y});
      pad.classList.add('drag'); showBadge('拖动中');
    }
    send({t: 'pen', p: 1, x: p.x, y: p.y}); g.abs = p;
    return;
  }
  const want = modeFor(cur.length);
  if (!g.mode) {
    if (g.disp < TAP_SLOP) return;    // 还在轻点 / 长按的范围里
    clearHold();
    startTouch(want, cur, now);
    return;                           // 起手这一段已经在 startTouch 里补上了
  }

  if (RANK[want] > RANK[g.mode] && g.modeTravel < 40 && !(g.mode === 'move' && want === 'scroll')) { startTouch(want, cur, now); return; }
  g.modeTravel += Math.hypot(dx, dy);
  switch (g.mode) {
    case 'move':                      // 单指（或中途加一指）滑动 = 滚动
      if (cur.length <= 2) queueScroll(dx, dy, now, macPerPx());
      break;
    case 'scroll':
      twoFinger(cur, dx, dy, now, macPerPx());
      break;
    case 'drag': {                    // 三指拖动：在手指的位置按住拖
      const c = centroid(cur), p = screenPoint(c.x, c.y, true);
      if (p) { send({t: 'pen', p: 1, x: p.x, y: p.y}); g.abs = p; }
      break;
    }
    case 'swipe':
      g.sx += dx; g.sy += dy;
      break;

function startTouch(m, cur, now) {

  g.mode = m; g.modeTravel = 0;
  g.sub = m === 'scroll' && scrolling ? 'pan' : null;   // 单指滚着又放下一根：接着滚
  showBadge({drag: '拖动中', swipe: '四指'}[m] || '');

    // 先把光标移到手指下面：滚动的才是手指按着的那块内容
    if (!g.aimed) {
      const fs = [...g.f.values()], c = {x: 0, y: 0};
      for (const f of fs) { c.x += f.x0 / fs.length; c.y += f.y0 / fs.length; }
      const p = screenPoint(c.x, c.y, true);
      if (p) send({t: 'moveTo', x: p.x, y: p.y});
      g.aimed = true;
    }
    if (m === 'move') {
      const f = g.f.get(cur[0].identifier);
      let ix = f.x - f.x0, iy = f.y - f.y0;

      queueScroll(ix, iy, now, macPerPx());
    }

    const c = centroid(cur), p = screenPoint(c.x, c.y, true);
    if (p) { g.absDown = true; g.abs = p; send({t: 'pen', p: 0, x: p.x, y: p.y}); pad.classList.add('drag'); haptic(); }

function endGesture(e) {

  if (e.type === 'touchcancel') g.cancelled = true;
  for (const t of e.changedTouches) {
    const finger = g.f.get(t.identifier);
    if (!finger) continue;
    g.disp = Math.max(g.disp, Math.hypot(t.clientX - finger.x0, t.clientY - finger.y0));
    g.f.delete(t.identifier);
  }
  const left = [...e.targetTouches].filter(t => g.f.has(t.identifier));
  if (left.length > 0) {              // 还有手指没抬起

    return;

function padEnd(tap) {
  if (g.down) send({t: 'up', b: 'left'});
  else if (tap) {

    else send({t: 'click', b: g.max >= 3 ? 'middle' : 'right'});

function touchEnd(tap, cancel) {

  } else if (g.held) {
    if (!cancel) { send({t: 'clickAt', x: g.anchor.x, y: g.anchor.y, b: 'right'}); haptic(); }   // 长按松手 = 右键

    if (g.max === 1) { const p = tapPoint(g.x0, g.y0); if (p) sendTextTarget({t: 'clickAt', x: p.x, y: p.y, b: 'left'}); }

      const p = screenPoint(g.multi.cx, g.multi.cy, true);

pad.addEventListener('touchend', endGesture, {passive: false});
pad.addEventListener('touchcancel', endGesture, {passive: false});
document.addEventListener('gesturestart', e => e.preventDefault());

// 离开页面时，别让 Mac 上的鼠标键一直按着
function releaseAll() {
  abortGesture();
  if (leftHeld) { send({t: 'up', b: 'left'}); leftHeld = false; $('#btnLeft').classList.remove('on'); $('#sLeft').classList.remove('on'); }
  if (pen && pen.live) send({t: 'up', b: 'left'});
  pen = null;
  stopMomentum();
}

// ---------- 底部按钮 ----------
// 「按住左键」：左手按住，右手在触控板上移动 = 拖动
let leftHeld = false;
function bindLeft(bl) {
  bl.addEventListener('touchstart', e => { e.preventDefault(); leftHeld = true; bl.classList.add('on'); send({t: 'down', b: 'left'}); haptic(); }, {passive: false});
  const up = e => { e.preventDefault(); bl.classList.remove('on'); if (!leftHeld) return; leftHeld = false; send({t: 'up', b: 'left'}); };
  bl.addEventListener('touchend', up, {passive: false});
  bl.addEventListener('touchcancel', up, {passive: false});
  if (!('ontouchstart' in window)) bl.addEventListener('click', () => send({t: 'click', b: 'left'}));
}
function bindRight(br) {
  br.addEventListener('touchstart', e => { e.preventDefault(); br.classList.add('on'); send({t: 'click', b: 'right'}); haptic(); }, {passive: false});

  Z.s = s; Z.x = clamp(x, W - W * s, 0); Z.y = clamp(y, H - H * s, 0);
  const t = Z.s === 1 ? '' : `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  scr.style.transform = t; glView.style.transform = t;
  drawCursor();
}
function zoomBegin(m) {
  const c = padLocal(m.cx, m.cy);
  g.zs = {s: Z.s, x: Z.x, y: Z.y, d0: m.d0 || 1, px: (c.lx - Z.x) / Z.s, py: (c.ly - Z.y) / Z.s};
  showBadge('缩放');
}
function zoomPinch(cur) {
  if (cur.length !== 2) return;
  const z = g.zs, d = Math.hypot(cur[0].clientX - cur[1].clientX, cur[0].clientY - cur[1].clientY);
  const s = clamp(z.s * d / z.d0, 1, 5), c = padLocal((cur[0].clientX + cur[1].clientX) / 2, (cur[0].clientY + cur[1].clientY) / 2);
  setZoom(s, c.lx - z.px * s, c.ly - z.py * s);      // 两指中间那一点一直在手指下面
  showBadge(s > 1.02 ? s.toFixed(1) + '×' : '缩放');
}
function zoomEnd() { if (Z.s < 1.1) setZoom(1, 0, 0); }
function panView(dx, dy) { setZoom(Z.s, Z.x + dx, Z.y + dy); }

// ---------- 手机自己画的光标 ----------
// Mac 每 33 ms 报一次光标位置（带上已处理到第几条移动），手机在它的基础上加上还没被处理的移动：手指一动光标就动
const CUR = {on: false, x: 0.5, y: 0.5, hold: 0, img: null};
const pendMoves = [];
let moveSeq = 0;
function onCursor(m) {
  if (!S.localCursor) return;
  while (pendMoves.length && pendMoves[0].s <= m.s) pendMoves.shift();
  if (performance.now() > CUR.hold) { CUR.x = m.x; CUR.y = m.y; }
  if (!CUR.on) { CUR.on = true; $('#cur').classList.add('on'); }
  drawCursor();
}
function onCursorImg(m) {
  CUR.img = {w: m.w, h: m.h, hx: m.hx, hy: m.hy};
  $('#cur img').src = 'data:image/png;base64,' + m.png;
  drawCursor();
}
// 画面在 pad 里的位置（object-fit: contain 之后，没放大时）
function contentRect() {
  const W = pad.clientWidth, H = pad.clientHeight;
  const k = Math.min(W / view.width, H / view.height), dw = view.width * k, dh = view.height * k;
  return {ox: (W - dw) / 2, oy: (H - dh) / 2, dw, dh, W, H};
}
function cursorNow() {
  let x = CUR.x, y = CUR.y;
  const w = scrInfo.w || 1440, h = scrInfo.h || 900;
  for (const p of pendMoves) { x += p.dx / w; y += p.dy / h; }
  return {x: clamp(x, 0, 1), y: clamp(y, 0, 1)};
}
function drawCursor(follow) {
  const el = $('#cur');
  if (!CUR.on || !view.width || !CUR.img) return;
  const r = contentRect(), p = cursorNow();
  let px = r.ox + p.x * r.dw, py = r.oy + p.y * r.dh;
  // 触控板模式放大着：光标快出视野时，视野跟着移
  if (follow && Z.s > 1.02 && !touchMode()) {
    const sx = Z.x + px * Z.s, sy = Z.y + py * Z.s, mx = r.W * 0.18, my = r.H * 0.18;
    let nx = Z.x, ny = Z.y;
    if (sx < mx) nx += mx - sx; else if (sx > r.W - mx) nx -= sx - (r.W - mx);
    if (sy < my) ny += my - sy; else if (sy > r.H - my) ny -= sy - (r.H - my);
    if (nx !== Z.x || ny !== Z.y) { setZoom(Z.s, nx, ny); return; }
  }
  const ppp = r.dw / (scrInfo.w || 1440) * Z.s;               // 每个 Mac 点在手机上多少 CSS 像素
  const longest = Math.max(CUR.img.w, CUR.img.h) || 1;
  const k = clamp(ppp, 18 / longest, 56 / longest);          // 光标别太小也别太大
  const w = CUR.img.w * k, h = CUR.img.h * k;
  const x = Z.x + px * Z.s - CUR.img.hx * k, y = Z.y + py * Z.s - CUR.img.hy * k;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = `translate(${x}px,${y}px)`;
}

// Apple Pencil 落点 → Mac 屏幕相对位置。开着屏幕时点画面上的位置；没开屏幕时整块触控板对应整个 Mac 屏幕（像数位板）
function penPoint(t, clampIt) {
  if (screenOn && view.width) return screenPoint(t.clientX, t.clientY, clampIt);
  const {lx, ly, W, H} = padLocal(t.clientX, t.clientY);
  return {x: +clamp(lx / W, 0, 1).toFixed(4), y: +clamp(ly / H, 0, 1).toFixed(4)};
}
let fpsSampleAt = performance.now();
setInterval(() => {
  const now = performance.now();
  const elapsed = now - fpsSampleAt;
  if (elapsed < 500) return;
  const drawnFps = Math.round(frames * 1000 / elapsed);
  const receivedFps = Math.round(receivedFrames * 1000 / elapsed);
  fpsSampleAt = now;
  if (screenOn) {
    const target = screenTargetFps();
    const source = scrInfo.hz > 0 ? ` · 源 ${Math.round(scrInfo.hz)} Hz` : '';
    const host = hostStatsOK && hostRates && now - hostRates.at < 2500 ? `采集 ${hostRates.capture} · 编码 ${hostRates.encode} · ` : '';
    if (IPAD) $('#ipadStreamStatus').textContent = `${drawnFps} FPS · ${codec === 'h264' ? '视频' : '图片'}`;
    else $('#fps').textContent = `目标 ${target} FPS · ${modeLabel()}${source}\n${host}接收 ${receivedFps} · 绘制 ${drawnFps} FPS`;
    if (hostStatsOK && ws && ws.readyState === 1) send({t: 'screenStats', id: ++statsID});
  }
  frames = 0; receivedFrames = 0;
}, 1000);
$('#btnScreen').addEventListener('click', () => { if (!debounced('screen')) setScreen(!screenOn); });
$('#scrClose').addEventListener('touchstart', e => e.stopPropagation(), {passive: true});
$('#scrClose').addEventListener('click', e => { e.stopPropagation(); setScreen(false); });
// 转屏 / 尺寸变化后按新尺寸要画面
var rsTimer;
addEventListener('resize', updateLayout);
$('#sExit').addEventListener('click', () => setScreen(false));
$('#sSet').addEventListener('click', () => toggleSheet('settings'));

// ---------- Pencil 手写板（iPad 随手写 Scribble）----------
// 手写板就是一个透明的大输入框：iPadOS 把 Pencil 写的字识别成文字放进来，网页把变化实时打到 Mac 上
const hw = $('#hw'), hwText = $('#hwText');
let hwLast = '', hwComposing = false;
const segmenter = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
const graphemes = str => segmenter ? Array.from(segmenter.segment(str), x => x.segment) : Array.from(str);
function hwOpen() {
  if (hw.classList.contains('open')) return;
  hwText.value = ''; hwLast = '';
  hw.classList.add('open');
  sideOpen(false);
  haptic();
}
function hwClose() {
  if (!hw.classList.contains('open')) return;
  hw.classList.remove('open');
  hwText.blur(); hwText.value = ''; hwLast = '';
}
// 和上次比：后面变了的部分先在 Mac 上退格删掉，再把新的打上去（划掉删除、自动更正都能跟上）
function hwSync() {
  if (hwComposing) return;
  const a = graphemes(hwLast), b = graphemes(hwText.value);
  let i = 0;
  while (i < a.length && i < b.length && a[i] === b[i]) i++;
  for (let k = i; k < a.length; k++) send({t: 'key', key: 'delete'});
  const add = b.slice(i).join('');
  if (add) send({t: 'text', text: add, paste: S.paste});
  hwLast = hwText.value;
}
hwText.addEventListener('compositionstart', () => hwComposing = true);
hwText.addEventListener('compositionend', () => { hwComposing = false; setTimeout(hwSync, 0); });
hwText.addEventListener('input', e => { if (!e.isComposing) hwSync(); });
hwText.addEventListener('keydown', e => {
  if (e.isComposing || hwComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); hwKey('enter'); }
  else if (e.key === 'Backspace' && !hwText.value) { e.preventDefault(); send({t: 'key', key: 'delete'}); }
});
function hwKey(k) {
  if (k === 'del') {
    const g = graphemes(hwText.value);
    if (g.length) { g.pop(); hwText.value = g.join(''); hwLast = hwText.value; }
    send({t: 'key', key: 'delete'});
  } else if (k === 'space') { hwText.value += ' '; hwSync(); }
  else if (k === 'enter') { hwSync(); send({t: 'key', key: 'return'}); hwText.value = ''; hwLast = ''; }
  else if (k === 'done') hwClose();
  haptic();
}
hw.querySelectorAll('[data-hw]').forEach(b => {
  b.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); hwKey(b.dataset.hw); }, {passive: false});
  if (!('ontouchstart' in window)) b.addEventListener('click', () => hwKey(b.dataset.hw));
});
// 手指点一下手写板就关掉；Pencil 留给随手写
hw.addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  const t = e.changedTouches[0];
  if (t && t.touchType !== 'stylus') { e.preventDefault(); hwClose(); }
}, {passive: false});
$('#sHw').addEventListener('click', () => { hw.classList.contains('open') ? hwClose() : hwOpen(); });

// ---------- 看屏幕时的操作方式：触控板 / 触摸屏 ----------
function showMode() {
  const t = S.touchMode === 'touch';
  $('#sMode').textContent = t ? '触摸屏' : '触控板';
  $('#sMode').classList.toggle('on', t);
  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.v === S.touchMode));
}
function setTouchMode(v, quiet) {
  S.touchMode = v; saveS(); showMode();
  if (!quiet) toast(v === 'touch' ? '触摸屏：点哪点哪 · 滑动滚动 · 长按右键 / 拖动 · 多指手势照用' : '触控板：单指轻点左键 · 双指轻点右键 · 双指滑动滚动');
}
$('#sMode').addEventListener('click', () => { if (!debounced('mode')) { setTouchMode(S.touchMode === 'touch' ? 'pad' : 'touch'); armSideHide(); haptic(); } });
document.querySelectorAll('#segMode button').forEach(b => b.addEventListener('click', () => setTouchMode(b.dataset.v)));
showMode();

// ---------- 全屏看屏幕：按钮栏弹出 / 自动收起 ----------
let sideTimer = null;
const isSideOpen = () => document.body.classList.contains('sideOpen');
function sideOpen(open) { document.body.classList.toggle('sideOpen', open); armSideHide(); }
function armSideHide() {
  clearTimeout(sideTimer);
  if (!isSideOpen()) return;
  // 按住左键、开着面板时不收
  sideTimer = setTimeout(() => { if (leftHeld || openName) armSideHide(); else sideOpen(false); }, 4000);
}
$('#fab').addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); sideOpen(!isSideOpen()); haptic(); }, {passive: false});
if (!('ontouchstart' in window)) $('#fab').addEventListener('click', () => sideOpen(!isSideOpen()));
$('#side').addEventListener('touchstart', armSideHide, {passive: true});
// 摸画面（操作鼠标）时收起按钮栏；按住左键拖动时不收
pad.addEventListener('touchstart', () => { if (isSideOpen() && !openName && !leftHeld) sideOpen(false); }, {passive: true});
$('#sKeys').addEventListener('click', () => toggleSheet('keys'));

// ---------- 设置面板 ----------
const bind = (id, key, isBool) => {
  const el = $(id);
  if (isBool) el.checked = !!S[key]; else el.value = S[key];
  el.addEventListener(isBool ? 'change' : 'input', () => { S[key] = isBool ? el.checked : +el.value; saveS(); });
};
bind('#sSpeed', 'speed'); bind('#sScroll', 'scroll'); bind('#sNatural', 'natural', true);
bind('#sInertia', 'inertia', true); bind('#sPaste', 'paste', true); bind('#sHaptic', 'haptic', true);
bind('#sImm', 'immersive', true); $('#sImm').addEventListener('change', updateLayout);
bind('#sUnlock', 'autoUnlock', true);
bind('#sPin', 'pinSide', true);
bind('#sClip', 'clipSync', true);
bind('#sCur', 'localCursor', true); $('#sCur').addEventListener('change', () => { if (screenOn) subscribeScreen(); }); $('#sPin').addEventListener('change', updateLayout);
bind('#sFit', 'fitMac', true); $('#sFit').addEventListener('change', () => { if (screenOn) subscribeScreen(); });
bind('#sScribble', 'scribble', true);
bind('#sFps', 'fps'); bind('#sAutoLand', 'autoLand', true); bind('#sVideo', 'video', true);
$('#sVideo').addEventListener('change', () => {
  if (S.video) { vMaxW = 2880; delete S.vMaxW; saveS(); }
  showVideoNote();
  showFps();
  if (screenOn) subscribeScreen();
  if (S.video && !VIDEO_OK && httpsOK) location.replace(httpsRemoteURL());
});
showVideoNote();
$('#sAutoLand').addEventListener('change', updateLayout);
const showFps = () => {
  const target = screenTargetFps();
  $('#fpsVal').textContent = `${S.fps} 帧`;
  $('#fpsNote').textContent = target < S.fps ? `图片模式当前最多 ${target} 帧。开启 HTTPS 视频后会使用已选目标。` : '';
};
// 浏览器的绘制回调频率只作诊断。高帧率由用户选择，不随测量结果改动。
let refreshHz = 0;
function measureRefresh() {
  const times = [];
  const tick = t => {
    times.push(t);
    if (times.length < 40) return requestAnimationFrame(tick);
    const gaps = times.slice(1).map((x, i) => x - times[i]).sort((a, b) => a - b);
    refreshHz = 1000 / gaps[gaps.length >> 1];
    if (Number.isFinite(refreshHz)) reportClient();
  };
  requestAnimationFrame(tick);
}
measureRefresh();
// 看屏幕时手机不自动锁屏（Wake Lock，iOS 16.4+ 支持）
let wakeLock = null;
async function holdAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
  } catch (e) {}
}
showFps(); $('#sFps').addEventListener('input', () => { showFps(); showVideoNote(); });
$('#sFps').addEventListener('change', () => { if (screenOn) subscribeScreen(); });
const tok = $('#sToken'); tok.value = TOKEN;
tok.addEventListener('change', () => {
  TOKEN = tok.value.trim();
  try { localStorage.setItem('wb.token', TOKEN); } catch (e) {}
  fatal = false; if (ws) ws.close(); else connect();
});

// 系统键盘占用的区域只影响输入面板，手写板沿用缩小页面的方式。
let fittedWidth = 0;
function fit() {
  const vv = window.visualViewport;
  const reduced = vv && vv.height < document.documentElement.clientHeight - 120;
  const docked = !!(reduced && (kbNative || kbDocked));
  const dockChanged = docked !== kbDocked;
  kbDocked = docked;
  const handwriting = reduced && document.activeElement === hwText;
  kbIsUp = docked || handwriting;
  const h = Math.round(handwriting ? vv.height : window.innerHeight);
  const width = document.body.clientWidth;
  if (dockChanged || width !== fittedWidth || document.body.style.height !== h + 'px') {
    fittedWidth = width;
    document.body.style.height = h + 'px';
    updateLayout();
  } else {
    positionKeyboard();
  }
  if (!kbNative && !kbDocked) window.scrollTo(0, 0);
}
addEventListener('orientationchange', () => { setTimeout(fit, 120); setTimeout(fit, 500); });   // iOS 转屏后高度更新得晚
for (const [type, delay] of [['focus', 300], ['blur', 100]]) {
  ta.addEventListener(type, () => setTimeout(fit, delay));
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
addEventListener('resize', fit);
fit();

// 屏幕常亮（需要 HTTPS，http 下会静默失败）
async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
wake();

connect();
</script>
